name: Daily Sleep Status Report

# 每天檢查使用者所有部署的 Streamlit Community Cloud App（civilian_force_dashboard、
# civil-force-dashboard、vocab700-app、ttfd-scholarship、fire_safety_training）
# 目前是否處於休眠狀態，純唯讀監控，不會點擊喚醒按鈕、不會修改任何 App。
# 結果會發布成這個 repo 裡「🔍 每日 App 休眠監控報告」這則 Issue 的留言（方便回顧歷史紀錄，
# 也會依 GitHub 通知設定收到信件提醒），同時把結果 commit 成 status/latest_sleep_report.md，
# 供另一個雲端排程（透過 git clone 讀取，繞過一般網頁擷取會被擋的網路政策）轉發成推播通知。
# 執行時間對齊使用者的「Jerry 早晨綜合報告」（08:00 台北時間），讓兩則通知差不多同時抵達。
on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00（台灣時間 08:00）
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

jobs:
  sleep-status-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python 套件)
        run: pip install playwright

      - name: 快取 Chromium 瀏覽器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('.github/workflows/sleep-status-report.yml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Chromium 系統相依套件（有快取時仍需要）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: 檢查所有 App 休眠狀態
        run: python .github/scripts/check_all_sleep_status.py

      - name: 發佈報告到 GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ISSUE_NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "每日 App 休眠監控報告 in:title" --state open --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE_NUM" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🔍 每日 App 休眠監控報告" \
              --body-file sleep_report.md
          else
            gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" \
              --body-file sleep_report.md
          fi

      - name: Commit 最新報告到 status/latest_sleep_report.md
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/latest_sleep_report.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新每日休眠監控報告 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "報告內容跟上次相同，不需要新的 commit。"
          fi
